<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="version" content="16.0.0">
<meta name="author" content="امیررضا غلامی">
<meta name="theme-color" content="#050510">
<title>شکستن ستاره‌ها — نسخه ۱۶.۰.۰</title>
<style>
  :root {
    --bg-dark: #050510;
    --neon-cyan: #22d3ee;
    --neon-pink: #f472b6;
    --neon-purple: #a78bfa;
    --neon-gold: #fbbf24;
    --text: #f8fafc;
    --panel: rgba(255,255,255,0.06);
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: Tahoma, sans-serif;
    background: 
      radial-gradient(circle at 50% 0%, rgba(168,85,247,0.2) 0%, transparent 50%),
      radial-gradient(circle at 50% 100%, rgba(34,211,238,0.15) 0%, transparent 50%),
      var(--bg-dark);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    color: var(--text);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  
  /* ستاره‌های پس‌زمینه */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      radial-gradient(1px 1px at 10% 20%, white, transparent),
      radial-gradient(1px 1px at 30% 60%, white, transparent),
      radial-gradient(1px 1px at 50% 10%, white, transparent),
      radial-gradient(1px 1px at 70% 40%, white, transparent),
      radial-gradient(1px 1px at 90% 70%, white, transparent),
      radial-gradient(2px 2px at 15% 85%, #22d3ee, transparent),
      radial-gradient(2px 2px at 85% 15%, #f472b6, transparent);
    background-size: 100% 100%;
    opacity: 0.6;
    pointer-events: none;
    z-index: 0;
    animation: twinkle 4s ease-in-out infinite;
  }
  
  @keyframes twinkle {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.8; }
  }
  
  .container {
    width: 100%;
    max-width: 420px;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-height: 800px;
  }
  
  /* هدر */
  .header {
    text-align: center;
    margin-bottom: 8px;
  }
  
  h1 {
    font-size: 24px;
    font-weight: 900;
    margin-bottom: 2px;
    background: linear-gradient(90deg, #22d3ee, #a78bfa, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  .subtitle {
    font-size: 10px;
    opacity: 0.7;
  }
  
  .subtitle .author { color: var(--neon-gold); font-weight: bold; }
  
  /* آمار */
  .stats {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  
  .stat {
    background: var(--panel);
    backdrop-filter: blur(10px);
    padding: 6px;
    border-radius: 10px;
    flex: 1;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.05);
  }
  
  .stat-label { font-size: 9px; color: #94a3b8; margin-bottom: 2px; }
  .stat-value { font-size: 16px; font-weight: 900; color: var(--neon-cyan); }
  .stat-value.gold { color: var(--neon-gold); }
  .stat-value.pink { color: var(--neon-pink); }
  
  /* ناحیه بازی */
  .game-area {
    flex: 1;
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 
      0 0 30px rgba(34,211,238,0.2),
      inset 0 0 30px rgba(0,0,0,0.8);
    border: 2px solid rgba(34,211,238,0.3);
    background: #050510;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  
  /* صفحه شروع و پایان */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(5,5,15,0.9);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 20px;
    text-align: center;
    transition: opacity 0.3s;
  }
  
  .overlay.hidden { display: none; }
  
  .overlay h2 {
    font-size: 26px;
    margin-bottom: 12px;
    color: var(--neon-cyan);
    text-shadow: 0 0 15px var(--neon-cyan);
  }
  
  .overlay p {
    font-size: 13px;
    color: #cbd5e1;
    margin-bottom: 20px;
    line-height: 1.8;
  }
  
  .btn {
    padding: 14px 32px;
    border: none;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 900;
    font-family: inherit;
    cursor: pointer;
    background: linear-gradient(135deg, #22d3ee, #06b6d4);
    color: #0f172a;
    box-shadow: 0 0 20px rgba(34,211,238,0.5);
    transition: 0.2s;
  }
  
  .btn:active { transform: scale(0.95); }
  
  .btn-gold {
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    box-shadow: 0 0 20px rgba(251,191,36,0.5);
    color: #000;
  }
  
  /* صفحه باخت */
  .final-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
    max-width: 260px;
    margin-bottom: 20px;
    background: rgba(255,255,255,0.05);
    padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  
  .final-stat {
    text-align: center;
  }
  
  .final-stat .label { font-size: 10px; color: #94a3b8; }
  .final-stat .value { font-size: 18px; font-weight: 900; color: var(--neon-gold); }
  
  .new-record {
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    color: #000;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 12px;
    box-shadow: 0 0 15px rgba(251,191,36,0.6);
    animation: pulse 1s infinite;
  }
  
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  
  .footer {
    text-align: center;
    font-size: 9px;
    color: #64748b;
    margin-top: 6px;
  }
  
  .footer b { color: var(--neon-gold); }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>شکستن ستاره‌ها</h1>
    <div class="subtitle">ساخته شده توسط <span class="author">امیررضا غلامی</span> • v16.0.0</div>
  </div>
  
  <div class="stats">
    <div class="stat">
      <div class="stat-label">امتیاز</div>
      <div class="stat-value" id="score">۰</div>
    </div>
    <div class="stat">
      <div class="stat-label">مرحله</div>
      <div class="stat-value pink" id="level">۱</div>
    </div>
    <div class="stat">
      <div class="stat-label">رکورد</div>
      <div class="stat-value gold" id="best">۰</div>
    </div>
  </div>
  
  <div class="game-area" id="gameArea">
    <canvas id="game" width="360" height="480"></canvas>
    
    <!-- شروع -->
    <div class="overlay" id="startOverlay">
      <h2>🌌 شکستن ستاره‌ها</h2>
      <p>انگشتت رو روی صفحه بکش تا<br>سفینه رو کنترل کنی<br>و همه آجرها رو بشکنی!</p>
      <button class="btn" onclick="startGame()">شروع بازی</button>
    </div>
    
    <!-- پایان -->
    <div class="overlay hidden" id="gameoverOverlay">
      <h2>💥 سفینه نابود شد!</h2>
      <div id="newRecordBadge"></div>
      <div class="final-stats">
        <div class="final-stat">
          <div class="label">امتیاز نهایی</div>
          <div class="value" id="finalScore">۰</div>
        </div>
        <div class="final-stat">
          <div class="label">رکورد</div>
          <div class="value" id="finalBest">۰</div>
        </div>
      </div>
      <button class="btn btn-gold" onclick="startGame()">🔄 دوباره</button>
    </div>
  </div>
  
  <div class="footer">نسخه <b>16.0.0</b> — Space Edition</div>
</div>

<script>
// ===== اطلاعات نسخه =====
const APP_VERSION = '16.0.0';
const APP_AUTHOR = 'امیررضا غلامی';
console.log(`🌌 شکستن ستاره‌ها v${APP_VERSION}`);
console.log(`👨‍💻 ساخته شده توسط: ${APP_AUTHOR}`);

// ===== تنظیمات =====
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// تنظیم سایز کانواس با توجه به اندازه واقعی
function resizeCanvas() {
  const rect = document.getElementById('gameArea').getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
}
window.addEventListener('resize', resizeCanvas);
setTimeout(resizeCanvas, 100); // بعد از لود کامل

// ===== متغیرهای بازی =====
let gameRunning = false;
let animationId = null;
let score = 0;
let level = 1;
let best = parseInt(localStorage.getItem('breakout_best') || '0');

// ===== اشیاء بازی =====
let paddle = {
  width: 80,
  height: 12,
  x: 0,
  y: 0,
  speed: 7,
  targetX: 0, // برای لمس
};

let ball = {
  x: 0,
  y: 0,
  radius: 8,
  dx: 4,
  dy: -4,
  speed: 5,
};

let bricks = [];
let particles = [];

// تنظیمات آجرها
const BRICK_ROWS = 6;
const BRICK_COLS = 6;
const BRICK_WIDTH = 50; // نسبی تنظیم میشه
const BRICK_HEIGHT = 20;
const BRICK_PADDING = 6;
const BRICK_OFFSET_TOP = 60;

const COLORS = [
  'linear-gradient(135deg, #f472b6, #db2777)',
  'linear-gradient(135deg, #a78bfa, #7c3aed)',
  'linear-gradient(135deg, #22d3ee, #0891b2)',
  'linear-gradient(135deg, #10b981, #059669)',
  'linear-gradient(135deg, #fbbf24, #d97706)',
  'linear-gradient(135deg, #ef4444, #b91c1c)',
];
const COLORS_HEX = ['#f472b6', '#a78bfa', '#22d3ee', '#10b981', '#fbbf24', '#ef4444'];

// ===== صدا =====
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playTone(freq, duration = 0.1, type = 'sine', volume = 0.15) {
  try {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}
function vibrate(ms = 15) { if (navigator.vibrate) navigator.vibrate(ms); }

// ===== ساخت آجرها =====
function createBricks() {
  bricks = [];
  const playWidth = canvas.width;
  const brickWidth = (playWidth - BRICK_PADDING * (BRICK_COLS + 1)) / BRICK_COLS;
  
  for (let r = 0; r < BRICK_ROWS; r++) {
    for (let c = 0; c < BRICK_COLS; c++) {
      // در هر مرحله چند تا آجر خالی بذاریم تا شکستنش راحت‌تر باشه
      if (Math.random() < 0.05 && level > 1) continue; 
      
      bricks.push({
        x: BRICK_PADDING + c * (brickWidth + BRICK_PADDING),
        y: BRICK_OFFSET_TOP + r * (BRICK_HEIGHT + BRICK_PADDING),
        width: brickWidth,
        height: BRICK_HEIGHT,
        color: COLORS[r],
        colorHex: COLORS_HEX[r],
        alive: true,
        row: r,
      });
    }
  }
}

// ===== شروع بازی =====
function startGame() {
  document.getElementById('startOverlay').classList.add('hidden');
  document.getElementById('gameoverOverlay').classList.add('hidden');
  
  resizeCanvas();
  score = 0;
  level = 1;
  updateUI();
  
  paddle.width = 80;
  paddle.y = canvas.height - 40;
  paddle.x = (canvas.width - paddle.width) / 2;
  paddle.targetX = paddle.x + paddle.width / 2;
  
  resetBall();
  createBricks();
  gameRunning = true;
  
  if (animationId) cancelAnimationFrame(animationId);
  loop();
}

function resetBall() {
  ball.x = canvas.width / 2;
  ball.y = paddle.y - 20;
  ball.dx = 4 * (Math.random() > 0.5 ? 1 : -1);
  ball.dy = -4;
  ball.speed = 5;
  ball.radius = 8;
}

// ===== ذخیره بهترین امتیاز =====
function saveBest() {
  if (score > best) {
    best = score;
    localStorage.setItem('breakout_best', best);
    return true;
  }
  return false;
}

function updateUI() {
  document.getElementById('score').textContent = toPersian(score);
  document.getElementById('level').textContent = toPersian(level);
  document.getElementById('best').textContent = toPersian(best);
}

// ===== حلقه اصلی =====
function loop() {
  if (!gameRunning) return;
  
  update();
  draw();
  
  animationId = requestAnimationFrame(loop);
}

function update() {
  // حرکت تخته با لمس (به آرامی به سمت هدف)
  const paddleCenter = paddle.x + paddle.width / 2;
  const diff = paddle.targetX - paddleCenter;
  paddle.x += diff * 0.3;
  
  // محدود کردن تخته به کادر
  if (paddle.x < 0) paddle.x = 0;
  if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;
  
  // حرکت توپ
  ball.x += ball.dx;
  ball.y += ball.dy;
  
  // برخورد با دیوارها
  if (ball.x - ball.radius < 0) {
    ball.x = ball.radius;
    ball.dx = Math.abs(ball.dx);
    playTone(300, 0.05, 'sine', 0.1);
  }
  if (ball.x + ball.radius > canvas.width) {
    ball.x = canvas.width - ball.radius;
    ball.dx = -Math.abs(ball.dx);
    playTone(300, 0.05, 'sine', 0.1);
  }
  if (ball.y - ball.radius < 0) {
    ball.y = ball.radius;
    ball.dy = Math.abs(ball.dy);
    playTone(300, 0.05, 'sine', 0.1);
  }
  
  // برخورد با تخته
  if (ball.y + ball.radius > paddle.y &&
      ball.y - ball.radius < paddle.y + paddle.height &&
      ball.x + ball.radius > paddle.x &&
      ball.x - ball.radius < paddle.x + paddle.width) {
    
    // محاسبه زاویه بازتاب
    const hitPos = (ball.x - paddle.x) / paddle.width; // 0 تا 1
    const angle = (hitPos - 0.5) * Math.PI * 0.7; // -63 تا +63 درجه
    
    const speed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
    ball.dx = Math.sin(angle) * speed;
    ball.dy = -Math.abs(Math.cos(angle) * speed);
    
    ball.y = paddle.y - ball.radius;
    playTone(500, 0.08, 'sine', 0.15);
    vibrate(10);
  }
  
  // برخورد با آجرها
  for (const brick of bricks) {
    if (!brick.alive) continue;
    
    if (ball.x + ball.radius > brick.x &&
        ball.x - ball.radius < brick.x + brick.width &&
        ball.y + ball.radius > brick.y &&
        ball.y - ball.radius < brick.y + brick.height) {
      
      // پیدا کردن جهت برخورد
      const overlapLeft = (ball.x + ball.radius) - brick.x;
      const overlapRight = (brick.x + brick.width) - (ball.x - ball.radius);
      const overlapTop = (ball.y + ball.radius) - brick.y;
      const overlapBottom = (brick.y + brick.height) - (ball.y - ball.radius);
      
      const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);
      
      if (minOverlap === overlapLeft || minOverlap === overlapRight) {
        ball.dx = -ball.dx;
      } else {
        ball.dy = -ball.dy;
      }
      
      brick.alive = false;
      score += 10;
      updateUI();
      
      // افکت انفجار
      createParticles(brick.x + brick.width/2, brick.y + brick.height/2, brick.colorHex);
      
      playTone(600 + Math.random() * 200, 0.1, 'sine', 0.15);
      vibrate(15);
      
      // چک برد مرحله
      if (bricks.every(b => !b.alive)) {
        setTimeout(nextLevel, 300);
        gameRunning = false;
        return;
      }
      
      break;
    }
  }
  
  // سقوط توپ
  if (ball.y - ball.radius > canvas.height) {
    gameOver();
  }
  
  // آپدیت ذرات
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life -= 0.02;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ===== رسم =====
function draw() {
  // پاک کردن
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // خطوط زمینه
  ctx.strokeStyle = 'rgba(34,211,238,0.05)';
  ctx.lineWidth = 1;
  for (let i = 0; i < canvas.width; i += 40) {
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i, canvas.height);
    ctx.stroke();
  }
  
  // رسم آجرها
  for (const brick of bricks) {
    if (!brick.alive) continue;
    
    ctx.fillStyle = brick.color;
    ctx.shadowColor = brick.colorHex;
    ctx.shadowBlur = 10;
    
    // رسم مربع با گوشه‌های گرد
    roundRect(ctx, brick.x, brick.y, brick.width, brick.height, 4);
    ctx.fill();
    
    ctx.shadowBlur = 0;
  }
  
  // رسم توپ
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#22d3ee';
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  
  // رسم تخته
  const gradient = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x + paddle.width, paddle.y);
  gradient.addColorStop(0, '#22d3ee');
  gradient.addColorStop(1, '#a78bfa');
  ctx.fillStyle = gradient;
  ctx.shadowColor = '#22d3ee';
  ctx.shadowBlur = 15;
  roundRect(ctx, paddle.x, paddle.y, paddle.width, paddle.height, 6);
  ctx.fill();
  ctx.shadowBlur = 0;
  
  // رسم ذرات
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function createParticles(x, y, color) {
  for (let i = 0; i < 8; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 2 + Math.random() * 2,
      color: color,
      life: 1,
    });
  }
}

// ===== مرحله بعد =====
function nextLevel() {
  level++;
  paddle.width = Math.max(50, 80 - level * 3); // تخته کوچک‌تر
  paddle.x = (canvas.width - paddle.width) / 2;
  paddle.targetX = paddle.x + paddle.width / 2;
  
  resetBall();
  ball.speed += 0.5 * level;
  ball.dx = ball.speed * (Math.random() > 0.5 ? 1 : -1);
  ball.dy = -ball.speed;
  
  createBricks();
  updateUI();
  
  playTone(1000, 0.2, 'sine', 0.2);
  setTimeout(() => playTone(1500, 0.2, 'sine', 0.2), 150);
  
  gameRunning = true;
  loop();
}

// ===== باخت =====
function gameOver() {
  gameRunning = false;
  if (animationId) cancelAnimationFrame(animationId);
  
  playTone(200, 0.3, 'sawtooth', 0.2);
  setTimeout(() => playTone(150, 0.4, 'sawtooth', 0.2), 150);
  vibrate([50, 30, 50, 30, 100]);
  
  const isNewRecord = saveBest();
  
  document.getElementById('finalScore').textContent = toPersian(score);
  document.getElementById('finalBest').textContent = toPersian(best);
  
  const badge = document.getElementById('newRecordBadge');
  badge.innerHTML = isNewRecord && score > 0 ? '<div class="new-record">🏆 رکورد جدید!</div>' : '';
  
  setTimeout(() => {
    document.getElementById('gameoverOverlay').classList.remove('hidden');
  }, 300);
}

// ===== کنترل لمسی =====
function handleTouch(e) {
  if (!gameRunning) return;
  e.preventDefault();
  
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  
  const touch = e.touches ? e.touches[0] : e;
  const x = (touch.clientX - rect.left) * scaleX;
  
  paddle.targetX = x;
}

canvas.addEventListener('touchstart', handleTouch, { passive: false });
canvas.addEventListener('touchmove', handleTouch, { passive: false });

// ماوس برای دسکتاپ
canvas.addEventListener('mousemove', (e) => {
  if (!gameRunning) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  paddle.targetX = (e.clientX - rect.left) * scaleX;
});

// ===== ابزار =====
function toPersian(num) {
  return String(num).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
}

// ===== شروع اولیه =====
updateUI();
resizeCanvas();
</script>
