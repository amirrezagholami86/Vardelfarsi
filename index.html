<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="version" content="15.2.0">
<meta name="author" content="امیررضا غلامی">
<meta name="theme-color" content="#1E88E5">
<title>جدولستان — نسخه ۱۵.۲.۰</title>
<style>
  :root {
    --bg-main: #0f172a;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    
    --tile-empty: #334155;
    --tile-yellow: linear-gradient(135deg, #f59e0b, #d97706);
    --tile-blue: linear-gradient(135deg, #3b82f6, #2563eb);
    --tile-green: linear-gradient(135deg, #10b981, #059669);
    --tile-red: linear-gradient(135deg, #ef4444, #dc2626);
    
    --shadow-yellow: #b45309;
    --shadow-blue: #1d4ed8;
    --shadow-green: #047857;
    --shadow-red: #991b1b;
    
    --gold: #fbbf24;
    --danger: #ef4444;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: Tahoma, sans-serif;
    background-color: var(--bg-main);
    background-image: 
      radial-gradient(circle at 15% 50%, rgba(59,130,246,0.15), transparent 25%),
      radial-gradient(circle at 85% 30%, rgba(16,185,129,0.15), transparent 25%);
    min-height: 100vh;
    color: var(--text-main);
    overflow-y: auto;
    display: flex;
    justify-content: center;
  }
  
  .container {
    width: 100%;
    max-width: 440px;
    min-height: 100vh;
    padding-bottom: 10px;
    display: flex;
    flex-direction: column;
  }
  
  /* هدر */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: rgba(30, 41, 59, 0.8);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    margin: 8px 8px 8px 8px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    flex-shrink: 0;
  }
  
  .coin-display {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(0,0,0,0.4);
    padding: 4px 12px;
    border-radius: 20px;
    border: 2px solid var(--gold);
    box-shadow: 0 0 10px rgba(251,191,36,0.3);
  }
  
  .coin-icon { font-size: 18px; animation: coinFloat 2s ease-in-out infinite; }
  @keyframes coinFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  
  .coin-count { font-size: 16px; font-weight: 900; color: var(--gold); font-family: monospace; }
  
  .add-coin {
    width: 28px; height: 28px; border-radius: 50%; background: var(--gold); color: #000;
    border: none; font-size: 18px; font-weight: 900; display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 3px 0 #b45309; margin-right: 8px;
  }
  .add-coin:active { transform: translateY(2px); box-shadow: 0 1px 0 #b45309; }
  
  .version-badge { background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 20px; font-size: 10px; color: var(--text-muted); }
  
  /* ناحیه بازی */
  .game-area {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(30, 41, 59, 0.4);
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.05);
    margin: 0 8px 8px 8px;
    padding: 10px 0;
  }
  
  /* تخته ۹x۹ */
  .board {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    gap: 2px;
    width: 95%;
    max-width: 380px;
    aspect-ratio: 1;
    padding: 6px;
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
  }
  
  .cell {
    background: var(--tile-empty);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 900;
    color: #fff;
    position: relative;
    transition: all 0.2s;
  }
  
  .cell.hidden { visibility: hidden; pointer-events: none; }
  .cell.yellow { background: var(--tile-yellow); box-shadow: 0 2px 0 var(--shadow-yellow); }
  .cell.blue { background: var(--tile-blue); box-shadow: 0 2px 0 var(--shadow-blue); }
  .cell.green { background: var(--tile-green); box-shadow: 0 2px 0 var(--shadow-green); animation: pop 0.4s ease; }
  .cell.red { background: var(--tile-red); box-shadow: 0 2px 0 var(--shadow-red); animation: shake 0.3s ease; }
  .cell.active { transform: scale(1.1); z-index: 5; box-shadow: 0 0 10px #fff; border: 1px solid #fff; }
  
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  
  /* حباب راهنما */
  .clue-bubble {
    position: absolute; background: #fff; color: #000; padding: 6px 10px; border-radius: 8px;
    font-size: 11px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.4); z-index: 10;
    pointer-events: none; white-space: nowrap; transform: translate(-50%, -100%); opacity: 0; transition: opacity 0.2s;
  }
  .clue-bubble.show { opacity: 1; }
  .clue-bubble::after {
    content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
    border-width: 5px 5px 0; border-style: solid; border-color: #fff transparent transparent transparent;
  }
  
  /* کیبورد */
  .keyboard-wrap {
    background: rgba(30, 41, 59, 0.9);
    padding: 8px 6px;
    border-radius: 16px;
    margin: 0 8px;
    border: 1px solid rgba(255,255,255,0.1);
    flex-shrink: 0;
  }
  
  .keyboard { display: flex; flex-direction: column; gap: 4px; }
  .kb-row { display: flex; gap: 3px; justify-content: center; }
  
  .key {
    flex: 1; height: 38px; background: rgba(255,255,255,0.1); border: none; border-radius: 6px;
    color: #fff; font-size: 15px; font-weight: bold; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-family: Tahoma, sans-serif;
    box-shadow: 0 2px 0 rgba(0,0,0,0.3); transition: 0.1s;
  }
  
  .key:active { transform: translateY(2px); box-shadow: 0 0 0 rgba(0,0,0,0.3); background: rgba(255,255,255,0.2); }
  
  .key.action { flex: 1.5; font-size: 12px; color: #fff; }
  .key.delete { background: var(--danger); box-shadow: 0 2px 0 #991b1b; }
  .key.hint { background: #8b5cf6; box-shadow: 0 2px 0 #5b21b6; }
  
  /* صفحه شروع */
  .start-overlay {
    position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; border-radius: 20px; text-align: center; padding: 20px;
  }
  .start-overlay.hidden { display: none; }
  
  .glowing-title {
    font-size: 34px; font-weight: 900;
    background: linear-gradient(to right, #fbbf24, #f59e0b, #fbbf24);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 10px; animation: glow 2s infinite alternate;
  }
  @keyframes glow { from { filter: drop-shadow(0 0 5px rgba(251,191,36,0.5)); } to { filter: drop-shadow(0 0 15px rgba(251,191,36,1)); } }
  
  .start-overlay p { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.8; }
  .reward-box { background: rgba(251,191,36,0.1); border: 1px solid var(--gold); padding: 8px 16px; border-radius: 12px; margin-bottom: 20px; font-size: 11px; color: var(--gold); }
  
  .btn-start {
    padding: 12px 40px; background: linear-gradient(to bottom, #10b981, #059669);
    border: none; border-radius: 50px; color: #fff; font-size: 18px; font-weight: 900;
    cursor: pointer; box-shadow: 0 5px 0 #047857; transition: 0.1s;
  }
  .btn-start:active { transform: translateY(3px); box-shadow: 0 2px 0 #047857; }
  
  .author-credit { margin-top: 20px; font-size: 10px; color: var(--text-muted); }
  .author-credit b { color: #fff; }
  
  /* Toast */
  .toast {
    position: fixed; top: 5%; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: rgba(0,0,0,0.9); color: #fff; padding: 8px 18px; border-radius: 30px;
    font-size: 12px; font-weight: bold; opacity: 0; transition: 0.3s; z-index: 200; pointer-events: none;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div style="display:flex; align-items:center;">
      <div class="coin-display">
        <span class="coin-icon">💰</span>
        <span class="coin-count" id="coinCount">۵۰۰</span>
      </div>
      <button class="add-coin" onclick="addCoins(100)">+</button>
    </div>
    <span class="version-badge">v15.2.0</span>
  </div>
  
  <div class="game-area">
    <div class="board" id="board"></div>
    <div class="clue-bubble" id="clueBubble">راهنما</div>
    
    <div class="start-overlay" id="startOverlay">
      <h1 class="glowing-title">جدولستان</h1>
      <p>جدول کلمات ۹×۹<br>حواست به تقاطع کلمات باشه!</p>
      <div class="reward-box">🎁 جایزه تکمیل: <b>۵۰۰ سکه</b></div>
      <button class="btn-start" onclick="startGame()">شروع بازی</button>
      <div class="author-credit">ساخته شده توسط <b>امیررضا غلامی</b></div>
    </div>
  </div>
  
  <div class="keyboard-wrap">
    <div class="keyboard" id="keyboard"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const APP_VERSION = '15.2.0';
const APP_AUTHOR = 'امیررضا غلامی';
console.log(`جدولستان v${APP_VERSION} by ${APP_AUTHOR}`);

const WORDS = [
  { word: 'کتاب', r: 0, c: 0, dir: 'H', clue: 'چیزی که می‌خوانیم' },
  { word: 'مادر', r: 0, c: 5, dir: 'H', clue: 'مهربان‌ترین زن' },
  { word: 'دریا', r: 2, c: 0, dir: 'H', clue: 'پهنه آب شور' },
  { word: 'گل', r: 2, c: 5, dir: 'H', clue: 'زیبا و خوشبو' },
  { word: 'خانه', r: 4, c: 0, dir: 'H', clue: 'جای زندگی' },
  { word: 'دوست', r: 4, c: 6, dir: 'H', clue: 'رفیق و همدل' },
  { word: 'مدرسه', r: 6, c: 0, dir: 'H', clue: 'محل درس خواندن' },
  { word: 'ستاره', r: 8, c: 0, dir: 'H', clue: 'می‌درخشد در آسمان' },
  { word: 'کبوتر', r: 0, c: 0, dir: 'V', clue: 'پرنده‌ای که نامه می‌برد' },
  { word: 'مرد', r: 0, c: 5, dir: 'V', clue: 'مذکر انسان' },
  { word: 'کیسه', r: 0, c: 4, dir: 'V', clue: 'برای نگهداری پول' },
  { word: 'آسمان', r: 0, c: 7, dir: 'V', clue: 'بالای سر ما' },
  { word: 'گرگ', r: 2, c: 8, dir: 'V', clue: 'حیوان درنده جنگل' },
];

const SIZE = 9;
let grid = [], solution = [], userGrid = [];
let activeCell = null;
let coins = 500;
let revealedCells = new Set();
let gameRunning = false;
let completedWords = new Set(); // برای ذخیره کلماتی که کامل شدن

function loadCoins() {
  const c = localStorage.getItem('jadvalestan_coins_v15');
  if (c) coins = parseInt(c);
  updateCoins();
}
function updateCoins() {
  document.getElementById('coinCount').textContent = toPersian(coins);
  localStorage.setItem('jadvalestan_coins_v15', coins);
}
function addCoins(amount) {
  coins += amount;
  updateCoins();
  playTone(800, 0.1, 'sine', 0.2);
  setTimeout(() => playTone(1200, 0.15, 'sine', 0.2), 100);
  showToast(`+${toPersian(amount)} سکه!`);
}

let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playTone(freq, duration = 0.1, type = 'sine', volume = 0.15) {
  try {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}
function vibrate(ms = 15) { if (navigator.vibrate) navigator.vibrate(ms); }

function buildGrid() {
  grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  solution = Array.from({ length: SIZE }, () => Array(SIZE).fill(''));
  userGrid = Array.from({ length: SIZE }, () => Array(SIZE).fill(''));
  revealedCells.clear();
  completedWords.clear();
  
  for (const w of WORDS) {
    for (let i = 0; i < w.word.length; i++) {
      const r = w.dir === 'H' ? w.r : w.r + i;
      const c = w.dir === 'H' ? w.c + i : w.c;
      if (r < SIZE && c < SIZE) {
        grid[r][c] = 1;
        solution[r][c] = w.word[i];
      }
    }
  }
}

function renderBoard() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;
      if (grid[r][c] === 0) {
        cell.classList.add('hidden');
      } else {
        cell.classList.add('yellow');
        if (userGrid[r][c]) {
          cell.textContent = userGrid[r][c];
          // اگه قبلاً درست زده شده بود، رنگش رو حفظ کن
          if (userGrid[r][c] === solution[r][c]) {
             cell.classList.remove('yellow');
             cell.classList.add('blue');
          }
        }
        cell.onclick = () => selectCell(r, c);
      }
      boardEl.appendChild(cell);
    }
  }
}

function selectCell(r, c) {
  if (!gameRunning || grid[r][c] === 0) return;
  vibrate(10);
  playTone(500, 0.05, 'sine', 0.08);
  
  let word = null, dir = 'H';
  for (const w of WORDS) {
    if (w.dir === 'H' && w.r === r && c >= w.c && c < w.c + w.word.length) { word = w; dir = 'H'; break; }
  }
  if (!word) {
    for (const w of WORDS) {
      if (w.dir === 'V' && w.c === c && r >= w.r && r < w.r + w.word.length) { word = w; dir = 'V'; break; }
    }
  }
  if (!word) return;
  
  activeCell = { r, c, dir, word };
  
  document.querySelectorAll('.cell').forEach(el => {
    el.classList.remove('active');
    el.style.filter = '';
  });
  
  for (let i = 0; i < word.word.length; i++) {
    const rr = word.dir === 'H' ? word.r : word.r + i;
    const cc = word.dir === 'H' ? word.c + i : word.c;
    const el = document.querySelector(`.cell[data-r="${rr}"][data-c="${cc}"]`);
    if (el) el.style.filter = 'brightness(1.3)';
  }
  
  const activeEl = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
  if (activeEl) activeEl.classList.add('active');
  
  showBubble(r, c, word.clue);
}

function showBubble(r, c, text) {
  const bubble = document.getElementById('clueBubble');
  const cell = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
  const gameArea = document.querySelector('.game-area').getBoundingClientRect();
  const rect = cell.getBoundingClientRect();
  
  bubble.textContent = text;
  bubble.style.left = (rect.left - gameArea.left + rect.width / 2) + 'px';
  bubble.style.top = (rect.top - gameArea.top - 8) + 'px';
  bubble.classList.add('show');
}

function typeLetter(letter) {
  if (!activeCell || !gameRunning) return;
  vibrate(10);
  playTone(700, 0.05, 'sine', 0.1);
  
  const { r, c } = activeCell;
  userGrid[r][c] = letter;
  
  const el = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
  if (el) {
    el.textContent = letter;
    el.classList.remove('yellow', 'green', 'blue', 'red');
    
    // رنگ‌بندی هوشمند: اگه حرف درست بود آبی، اگه غلط بود قرمز
    if (letter === solution[r][c]) {
      el.classList.add('blue');
    } else {
      el.classList.add('red');
      playTone(200, 0.15, 'sawtooth', 0.1); // صدای خطا
    }
  }
  
  // چک کردن کلمه‌هایی که این خونه رو دارن
  checkWordsAt(r, c);
  moveNext();
}

function moveNext() {
  if (!activeCell) return;
  const { r, c, dir, word } = activeCell;
  let nr = r, nc = c;
  if (dir === 'H') nc++; else nr++;
  
  let foundNext = false;
  if (dir === 'H' && nc < word.c + word.word.length) {
    const el = document.querySelector(`.cell[data-r="${nr}"][data-c="${nc}"]`);
    if (el && !el.classList.contains('hidden')) { activeCell = { r: nr, c: nc, dir, word }; foundNext = true; }
  } else if (dir === 'V' && nr < word.r + word.word.length) {
    const el = document.querySelector(`.cell[data-r="${nr}"][data-c="${nc}"]`);
    if (el && !el.classList.contains('hidden')) { activeCell = { r: nr, c: nc, dir, word }; foundNext = true; }
  }
  
  if (foundNext) {
    selectCell(activeCell.r, activeCell.c);
  } else {
    document.getElementById('clueBubble').classList.remove('show');
    document.querySelectorAll('.cell').forEach(el => {
      el.classList.remove('active');
      el.style.filter = '';
    });
    activeCell = null;
  }
}

function deleteLetter() {
  if (!activeCell || !gameRunning) return;
  vibrate(10);
  playTone(300, 0.08, 'sine', 0.1);
  
  const { r, c } = activeCell;
  if (userGrid[r][c]) {
    userGrid[r][c] = '';
    const el = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
    if (el) {
      el.textContent = '';
      el.classList.remove('blue', 'green', 'red');
      el.classList.add('yellow');
    }
    completedWords.clear(); // بعد از پاک کردن، وضعیت کلمات رو دوباره چک می‌کنیم
    checkAllWords();
  } else {
    const { dir, word } = activeCell;
    let pr = r, pc = c;
    if (dir === 'H') pc--; else pr--;
    
    if (pr >= 0 && pc >= 0) {
       const inWord = dir === 'H' ? (pr === word.r && pc >= word.c && pc < word.c + word.word.length) :
                                   (pc === word.c && pr >= word.r && pr < word.r + word.word.length);
       if (inWord) {
          activeCell = { r: pr, c: pc, dir, word };
          deleteLetter();
       }
    }
  }
}

function useHint() {
  if (!activeCell || !gameRunning) { showToast('اول یه کلمه انتخاب کن!'); return; }
  if (coins < 50) { showToast('حداقل ۵۰ سکه لازمه!'); return; }
  
  const { r, c } = activeCell;
  if (revealedCells.has(`${r}-${c}`)) { showToast('این خونه راهنمایی شده!'); return; }
  
  coins -= 50;
  updateCoins();
  revealedCells.add(`${r}-${c}`);
  userGrid[r][c] = solution[r][c];
  
  const el = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
  if (el) {
    el.textContent = solution[r][c];
    el.classList.remove('yellow', 'red');
    el.classList.add('green');
    setTimeout(() => {
      if (el.classList.contains('green')) { el.classList.remove('green'); el.classList.add('blue'); }
    }, 500);
  }
  
  playTone(800, 0.15, 'sine', 0.2);
  showToast('-۵۰ سکه (راهنما)');
  checkWordsAt(r, c);
  moveNext();
}

// این تابع چک می‌کنه که آیا کلمه‌هایی که این خونه رو شامل میشن کامل و درست هستن یا نه
function checkWordsAt(r, c) {
  let wordCompletedNow = false;
  
  for (const w of WORDS) {
    let inWord = false;
    if (w.dir === 'H' && w.r === r && c >= w.c && c < w.c + w.word.length) inWord = true;
    if (w.dir === 'V' && w.c === c && r >= w.r && r < w.r + w.word.length) inWord = true;
    
    if (!inWord) continue;
    
    // چک کن که کل کلمه پر شده و درست هست
    let isCorrect = true;
    for (let i = 0; i < w.word.length; i++) {
      const rr = w.dir === 'H' ? w.r : w.r + i;
      const cc = w.dir === 'H' ? w.c + i : w.c;
      if (userGrid[rr][cc] !== solution[rr][cc]) { isCorrect = false; break; }
    }
    
    const wordKey = `${w.word}-${w.r}-${w.c}-${w.dir}`;
    if (isCorrect && !completedWords.has(wordKey)) {
      completedWords.add(wordKey);
      wordCompletedNow = true;
      
      // همه خونه‌های این کلمه رو سبز کن
      for (let i = 0; i < w.word.length; i++) {
        const rr = w.dir === 'H' ? w.r : w.r + i;
        const cc = w.dir === 'H' ? w.c + i : w.c;
        const el = document.querySelector(`.cell[data-r="${rr}"][data-c="${cc}"]`);
        if (el) { el.classList.remove('yellow', 'blue', 'red'); el.classList.add('green'); }
      }
    }
  }
  
  if (wordCompletedNow) {
    playTone(900, 0.1, 'sine', 0.2);
    setTimeout(() => playTone(1200, 0.15, 'sine', 0.2), 100);
    addCoins(50);
    showToast('🎉 ۵۰ سکه جایزه بابت کلمه درست!');
    checkFullWin();
  }
}

// بررسی مجدد همه کلمات (مثلاً بعد از پاک کردن یه حرف)
function checkAllWords() {
  completedWords.clear();
  let hasChange = true;
  
  // چند بار اجرا میشه تا همه کلمات متقاطع بررسی بشن
  while (hasChange) {
    hasChange = false;
    for (const w of WORDS) {
      let isCorrect = true;
      for (let i = 0; i < w.word.length; i++) {
        const rr = w.dir === 'H' ? w.r : w.r + i;
        const cc = w.dir === 'H' ? w.c + i : w.c;
        if (userGrid[rr][cc] !== solution[rr][cc]) { isCorrect = false; break; }
      }
      const wordKey = `${w.word}-${w.r}-${w.c}-${w.dir}`;
      if (isCorrect && !completedWords.has(wordKey)) {
        completedWords.add(wordKey);
        hasChange = true;
        for (let i = 0; i < w.word.length; i++) {
          const rr = w.dir === 'H' ? w.r : w.r + i;
          const cc = w.dir === 'H' ? w.c + i : w.c;
          const el = document.querySelector(`.cell[data-r="${rr}"][data-c="${cc}"]`);
          if (el) { el.classList.remove('yellow', 'blue', 'red'); el.classList.add('green'); }
        }
      }
    }
  }
}

function checkFullWin() {
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (grid[r][c] === 1 && userGrid[r][c] !== solution[r][c]) return;
    }
  }
  gameRunning = false;
  showToast('🏆 تبریک! جدول کامل شد');
  addCoins(500);
  setTimeout(() => { document.getElementById('startOverlay').classList.remove('hidden'); }, 2500);
}

function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  
  const rows = [
    ['ض','ص','ث','ق','ف','غ','ع','ه','خ','ح'],
    ['ش','س','ی','ب','ل','ا','ت','ن','م','ک'],
    ['ظ','ط','ز','ر','ذ','د','پ','و','ژ','گ']
  ];
  
  rows.forEach(row => {
    const rowEl = document.createElement('div');
    rowEl.className = 'kb-row';
    row.forEach(l => {
      const k = document.createElement('button');
      k.className = 'key'; k.textContent = l;
      k.onclick = () => typeLetter(l);
      rowEl.appendChild(k);
    });
    kb.appendChild(rowEl);
  });
  
  const row4 = document.createElement('div');
  row4.className = 'kb-row';
  const hintBtn = document.createElement('button');
  hintBtn.className = 'key action hint'; hintBtn.textContent = '💡 راهنما (۵۰)';
  hintBtn.onclick = useHint;
  const delBtn = document.createElement('button');
  delBtn.className = 'key action delete'; delBtn.textContent = '⌫ پاک‌کن';
  delBtn.onclick = deleteLetter;
  row4.appendChild(hintBtn);
  row4.appendChild(delBtn);
  kb.appendChild(row4);
}

function toPersian(num) { return String(num).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function startGame() {
  document.getElementById('startOverlay').classList.add('hidden');
  gameRunning = true;
  activeCell = null;
  completedWords.clear();
  buildGrid();
  renderBoard();
  document.getElementById('clueBubble').classList.remove('show');
}

loadCoins();
buildKeyboard();
</script>
