<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="version" content="14.0.0">
<meta name="author" content="امیررضا غلامی">
<meta name="theme-color" content="#4a90e2">
<title>جدولستان — نسخه ۱۴.۰.۰</title>
<style>
  :root {
    --bg-main: #5c94d6;
    --bg-dark: #3a6ba5;
    --tile-yellow: #f5b041;
    --tile-yellow-dark: #d68910;
    --tile-white: #fdfefe;
    --tile-white-dark: #d5dbdb;
    --tile-blue: #5dade2;
    --tile-blue-dark: #2874a6;
    --tile-green: #2ecc71;
    --tile-green-dark: #1e8449;
    --text-dark: #1b2631;
    --bubble-bg: #3498db;
    --bubble-border: #fff;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: linear-gradient(135deg, #7fb3f0, var(--bg-main), var(--bg-dark));
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    color: #fff;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  
  /* بافت پشت صفحه */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(255,255,255,0.1) 0%, transparent 20%),
      radial-gradient(circle at 90% 80%, rgba(255,255,255,0.1) 0%, transparent 20%);
    pointer-events: none;
    z-index: 0;
  }
  
  .container {
    width: 100%;
    max-width: 440px;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 95vh;
    max-height: 800px;
  }
  
  /* هدر */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: rgba(0,0,0,0.2);
    border-radius: 12px;
    margin-bottom: 10px;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2);
  }
  
  .coin-display {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #1b2631;
    padding: 4px 12px;
    border-radius: 20px;
    border: 2px solid #f1c40f;
    box-shadow: 0 4px 0 #0e1621;
  }
  
  .coin-icon {
    font-size: 20px;
    color: #f1c40f;
    text-shadow: 0 2px 2px rgba(0,0,0,0.5);
    animation: coinSpin 3s linear infinite;
  }
  
  @keyframes coinSpin {
    0% { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
  }
  
  .coin-count {
    font-size: 18px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 1px;
    font-family: monospace;
  }
  
  .add-coin {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #f1c40f;
    color: #1b2631;
    border: none;
    font-size: 20px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 3px 0 #b7950b;
    margin-right: 8px;
  }
  
  .add-coin:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #b7950b;
  }
  
  .version-badge {
    background: rgba(255,255,255,0.2);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 1px;
    border: 1px solid rgba(255,255,255,0.4);
  }
  
  .icon-btns {
    display: flex;
    gap: 8px;
  }
  
  .icon-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #fff;
    color: var(--bg-dark);
    border: none;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.2);
  }
  
  .icon-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.2);
  }
  
  /* ناحیه بازی */
  .game-area {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 10px;
    background: rgba(255,255,255,0.1);
    border-radius: 16px;
    margin-bottom: 10px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
  }
  
  /* تخته */
  .board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    width: 100%;
    max-width: 340px;
    aspect-ratio: 1;
    padding: 10px;
  }
  
  .cell {
    background: var(--tile-white);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 900;
    color: var(--text-dark);
    position: relative;
    box-shadow: 
      0 4px 0 var(--tile-white-dark),
      inset 0 2px 0 rgba(255,255,255,1);
    transition: all 0.2s;
    cursor: pointer;
  }
  
  .cell.empty {
    background: transparent;
    box-shadow: none;
    pointer-events: none;
  }
  
  .cell.yellow {
    background: linear-gradient(135deg, #f7dc6f, var(--tile-yellow));
    box-shadow: 0 4px 0 var(--tile-yellow-dark), inset 0 2px 0 rgba(255,255,255,0.5);
  }
  
  .cell.blue {
    background: linear-gradient(135deg, #85c1e9, var(--tile-blue));
    box-shadow: 0 4px 0 var(--tile-blue-dark), inset 0 2px 0 rgba(255,255,255,0.5);
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  
  .cell.green {
    background: linear-gradient(135deg, #58d68d, var(--tile-green));
    box-shadow: 0 4px 0 var(--tile-green-dark), inset 0 2px 0 rgba(255,255,255,0.5);
    color: #fff;
    animation: pop 0.4s ease;
  }
  
  .cell.active {
    transform: scale(1.05);
    z-index: 5;
    box-shadow: 0 0 15px #fff, 0 4px 0 var(--tile-yellow-dark);
  }
  
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  
  /* حباب راهنما */
  .clue-bubble {
    position: absolute;
    background: var(--bubble-bg);
    color: #fff;
    padding: 6px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: bold;
    border: 2px solid var(--bubble-border);
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    z-index: 10;
    pointer-events: none;
    white-space: nowrap;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
  }
  
  .clue-bubble.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    animation: float 2s ease-in-out infinite;
  }
  
  @keyframes float {
    0%, 100% { margin-top: 0; }
    50% { margin-top: -5px; }
  }
  
  .clue-bubble::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 8px 8px 0;
    border-style: solid;
    border-color: var(--bubble-bg) transparent transparent transparent;
  }
  
  /* کیبورد */
  .keyboard-wrap {
    background: rgba(0,0,0,0.2);
    padding: 10px 5px;
    border-radius: 12px;
    box-shadow: inset 0 4px 0 rgba(0,0,0,0.1);
  }
  
  .keyboard {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  
  .kb-row {
    display: flex;
    gap: 4px;
    justify-content: center;
  }
  
  .key {
    flex: 1;
    max-width: 36px;
    aspect-ratio: 1;
    background: #fff;
    border: none;
    border-radius: 6px;
    color: var(--bg-dark);
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 0 #bdc3c7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Tahoma, sans-serif;
  }
  
  .key:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #bdc3c7;
  }
  
  .key.action {
    background: #f39c12;
    color: #fff;
    box-shadow: 0 3px 0 #d68910;
    flex: 1.5;
    max-width: none;
    font-size: 14px;
  }
  
  .key.action.delete {
    background: #e74c3c;
    box-shadow: 0 3px 0 #c0392b;
  }
  
  .key.action.hint {
    background: #9b59b6;
    box-shadow: 0 3px 0 #8e44ad;
  }
  
  /* صفحه شروع */
  .start-overlay {
    position: absolute;
    inset: 0;
    background: rgba(74,144,226,0.95);
    backdrop-filter: blur(5px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    border-radius: 16px;
    text-align: center;
    padding: 20px;
  }
  
  .start-overlay.hidden { display: none; }
  
  .start-overlay h1 {
    font-size: 36px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 4px 0 #2874a6;
    margin-bottom: 10px;
  }
  
  .start-overlay p {
    font-size: 14px;
    color: #eaf2f8;
    margin-bottom: 30px;
    line-height: 1.6;
  }
  
  .btn-start {
    padding: 15px 40px;
    background: linear-gradient(to bottom, #58d68d, #2ecc71);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 20px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 6px 0 #1e8449;
    text-shadow: 0 2px 0 rgba(0,0,0,0.2);
    transition: 0.1s;
  }
  
  .btn-start:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #1e8449;
  }
  
  .author-credit {
    margin-top: 30px;
    font-size: 12px;
    color: rgba(255,255,255,0.8);
  }
  
  .author-credit b {
    color: #f1c40f;
  }
  
  /* Toast */
  .toast {
    position: fixed;
    top: 10%;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    opacity: 0;
    transition: 0.3s;
    z-index: 200;
    pointer-events: none;
  }
  
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="container">
  <!-- هدر -->
  <div class="header">
    <div style="display:flex; align-items:center;">
      <div class="coin-display">
        <span class="coin-icon">💰</span>
        <span class="coin-count" id="coinCount">۱۰۰</span>
      </div>
      <button class="add-coin" onclick="addCoins(50)">+</button>
    </div>
    
    <span class="version-badge">v14.0.0</span>
    
    <div class="icon-btns">
      <button class="icon-btn" onclick="showToast('تنظیمات به زودی...')">⚙️</button>
    </div>
  </div>
  
  <!-- ناحیه بازی -->
  <div class="game-area">
    <div class="board" id="board"></div>
    <div class="clue-bubble" id="clueBubble">راهنما</div>
    
    <!-- صفحه شروع -->
    <div class="start-overlay" id="startOverlay">
      <h1>جدولستان</h1>
      <p>کلمات رو با راهنمای حبابی پیدا کن<br>حروف رو از کیبورد انتخاب کن</p>
      <button class="btn-start" onclick="startGame()">شروع بازی</button>
      <div class="author-credit">ساخته شده توسط <b>امیررضا غلامی</b></div>
    </div>
  </div>
  
  <!-- کیبورد -->
  <div class="keyboard-wrap">
    <div class="keyboard" id="keyboard"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== تنظیمات و داده‌ها =====
const APP_VERSION = '14.0.0';
const APP_AUTHOR = 'امیررضا غلامی';
console.log(`🧩 جدولستان v${APP_VERSION} by ${APP_AUTHOR}`);

// کلمات با موقعیت: row, col, dir (H/V), clue
const WORDS = [
  { word: 'کتاب', r: 1, c: 0, dir: 'H', clue: 'چیزی که می‌خوانیم' },
  { word: 'مادر', r: 0, c: 2, dir: 'V', clue: 'مهربان‌ترین زن' },
  { word: 'دریا', r: 3, c: 1, dir: 'H', clue: 'پهنه آب شور' },
  { word: 'گل', r: 2, c: 4, dir: 'V', clue: 'زیبا و خوشبو' },
];

let grid = [];
let solution = [];
let userGrid = [];
let activeCell = null;
let coins = 100;
let revealedCells = new Set();
let gameRunning = false;

// ===== ذخیره سکه =====
function loadCoins() {
  const c = localStorage.getItem('jadvalestan_coins');
  if (c) coins = parseInt(c);
  updateCoins();
}
function updateCoins() {
  document.getElementById('coinCount').textContent = toPersian(coins);
  localStorage.setItem('jadvalestan_coins', coins);
}
function addCoins(amount) {
  coins += amount;
  updateCoins();
  playTone(800, 0.1, 'sine', 0.2);
  setTimeout(() => playTone(1200, 0.15, 'sine', 0.2), 100);
  showToast(`+${toPersian(amount)} سکه دریافت کردید!`);
}

// ===== صدا =====
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playTone(freq, duration = 0.1, type = 'sine', volume = 0.15) {
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + duration);
}
function vibrate(ms = 15) { if (navigator.vibrate) navigator.vibrate(ms); }

// ===== ساخت جدول =====
function buildGrid() {
  grid = Array.from({ length: 5 }, () => Array(5).fill(0));
  solution = Array.from({ length: 5 }, () => Array(5).fill(''));
  userGrid = Array.from({ length: 5 }, () => Array(5).fill(''));
  revealedCells.clear();
  
  for (const w of WORDS) {
    for (let i = 0; i < w.word.length; i++) {
      const r = w.dir === 'H' ? w.r : w.r + i;
      const c = w.dir === 'H' ? w.c + i : w.c;
      if (r < 5 && c < 5) {
        grid[r][c] = 1;
        solution[r][c] = w.word[i];
      }
    }
  }
}

function renderBoard() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  
  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 5; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;
      
      if (grid[r][c] === 0) {
        cell.classList.add('empty');
      } else {
        cell.classList.add('yellow');
        if (userGrid[r][c]) {
          cell.textContent = userGrid[r][c];
        }
        cell.onclick = () => selectCell(r, c);
      }
      boardEl.appendChild(cell);
    }
  }
}

function selectCell(r, c) {
  if (!gameRunning) return;
  vibrate(10);
  playTone(500, 0.05, 'sine', 0.08);
  
  // پیدا کردن کلمه‌ای که این خانه در آن قرار دارد
  let word = null;
  let dir = 'H';
  
  // اول افقی
  for (const w of WORDS) {
    if (w.dir === 'H' && w.r === r && c >= w.c && c < w.c + w.word.length) {
      word = w; dir = 'H'; break;
    }
  }
  // اگر افقی نبود عمودی
  if (!word) {
    for (const w of WORDS) {
      if (w.dir === 'V' && w.c === c && r >= w.r && r < w.r + w.word.length) {
        word = w; dir = 'V'; break;
      }
    }
  }
  
  if (!word) return;
  
  activeCell = { r, c, dir, word };
  
  // هایلایت کلمه و خانه فعال
  document.querySelectorAll('.cell').forEach(el => {
    el.classList.remove('active');
    if (el.classList.contains('yellow')) el.style.background = '';
    if (el.classList.contains('blue')) el.style.background = '';
  });
  
  // هایلایت کل کلمه (فقط برای راهنما)
  for (let i = 0; i < word.word.length; i++) {
    const rr = word.dir === 'H' ? word.r : word.r + i;
    const cc = word.dir === 'H' ? word.c + i : word.c;
    const el = document.querySelector(`.cell[data-r="${rr}"][data-c="${cc}"]`);
    if (el) el.style.filter = 'brightness(1.2)';
  }
  
  const activeEl = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
  if (activeEl) activeEl.classList.add('active');
  
  // نمایش حباب راهنما
  showBubble(r, c, word.clue);
}

function showBubble(r, c, text) {
  const bubble = document.getElementById('clueBubble');
  const cell = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
  const rect = cell.getBoundingClientRect();
  const gameArea = document.querySelector('.game-area').getBoundingClientRect();
  
  bubble.textContent = text;
  bubble.style.left = (rect.left - gameArea.left + rect.width / 2) + 'px';
  bubble.style.top = (rect.top - gameArea.top - 10) + 'px';
  bubble.classList.add('show');
}

function typeLetter(letter) {
  if (!activeCell || !gameRunning) return;
  vibrate(10);
  playTone(700, 0.05, 'sine', 0.1);
  
  const { r, c } = activeCell;
  userGrid[r][c] = letter;
  
  const el = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
  if (el) {
    el.textContent = letter;
    el.classList.remove('yellow');
    el.classList.add('blue');
  }
  
  // بررسی کلمه
  checkWord(activeCell.word);
  
  // رفتن به خانه بعدی
  moveNext();
}

function moveNext() {
  if (!activeCell) return;
  const { r, c, dir, word } = activeCell;
  let nr = r, nc = c;
  
  if (dir === 'H') nc++;
  else nr++;
  
  // اگر توی کلمه بود
  if (dir === 'H' && nc < word.c + word.word.length) {
    const el = document.querySelector(`.cell[data-r="${nr}"][data-c="${nc}"]`);
    if (el && el.classList.contains('empty')) {
       // رد شو
       nc++;
    }
    if (nc < word.c + word.word.length) {
      activeCell = { r: nr, c: nc, dir, word };
      selectCell(nr, nc);
      return;
    }
  } else if (dir === 'V' && nr < word.r + word.word.length) {
     const el = document.querySelector(`.cell[data-r="${nr}"][data-c="${nc}"]`);
     if (el && el.classList.contains('empty')) {
        nr++;
     }
     if (nr < word.r + word.word.length) {
        activeCell = { r: nr, c: nc, dir, word };
        selectCell(nr, nc);
        return;
     }
  }
  
  // اگر آخر کلمه بود، حباب رو مخفی کن
  document.getElementById('clueBubble').classList.remove('show');
  document.querySelectorAll('.cell').forEach(el => {
    el.classList.remove('active');
    el.style.filter = '';
  });
  activeCell = null;
}

function deleteLetter() {
  if (!activeCell || !gameRunning) return;
  vibrate(10);
  playTone(300, 0.08, 'sine', 0.1);
  
  const { r, c } = activeCell;
  if (userGrid[r][c]) {
    userGrid[r][c] = '';
    const el = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
    if (el) {
      el.textContent = '';
      el.classList.remove('blue');
      el.classList.add('yellow');
    }
  } else {
    // برو عقب
    const { dir, word } = activeCell;
    let pr = r, pc = c;
    if (dir === 'H') pc--; else pr--;
    
    if (pr >= 0 && pc >= 0) {
       // چک کنیم توی کلمه هست
       const inWord = dir === 'H' ? (pr === word.r && pc >= word.c && pc < word.c + word.word.length) :
                                   (pc === word.c && pr >= word.r && pr < word.r + word.word.length);
       if (inWord) {
          activeCell = { r: pr, c: pc, dir, word };
          deleteLetter();
       }
    }
  }
}

function useHint() {
  if (!activeCell || !gameRunning) {
    showToast('اول یه کلمه انتخاب کن!');
    return;
  }
  
  if (coins < 20) {
    showToast('سکه کافی نداری!');
    return;
  }
  
  const { r, c } = activeCell;
  if (revealedCells.has(`${r}-${c}`)) {
    showToast('این خانه قبلاً راهنمایی شده!');
    return;
  }
  
  coins -= 20;
  updateCoins();
  revealedCells.add(`${r}-${c}`);
  userGrid[r][c] = solution[r][c];
  
  const el = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
  if (el) {
    el.textContent = solution[r][c];
    el.classList.remove('yellow');
    el.classList.add('green');
    setTimeout(() => {
      if (el.classList.contains('green')) {
         el.classList.remove('green');
         el.classList.add('blue');
      }
    }, 500);
  }
  
  playTone(800, 0.15, 'sine', 0.2);
  showToast('۲۰ سکه استفاده شد');
  checkWord(activeCell.word);
  moveNext();
}

function checkWord(word) {
  let isComplete = true;
  let isCorrect = true;
  
  for (let i = 0; i < word.word.length; i++) {
    const rr = word.dir === 'H' ? word.r : word.r + i;
    const cc = word.dir === 'H' ? word.c + i : word.c;
    
    const val = userGrid[rr][cc];
    const sol = solution[rr][cc];
    
    if (!val) {
      isComplete = false;
      isCorrect = false;
    } else if (val !== sol) {
      isCorrect = false;
    }
  }
  
  if (isCorrect) {
    // همه حروف سبز بشن
    for (let i = 0; i < word.word.length; i++) {
      const rr = word.dir === 'H' ? word.r : word.r + i;
      const cc = word.dir === 'H' ? word.c + i : word.c;
      const el = document.querySelector(`.cell[data-r="${rr}"][data-c="${cc}"]`);
      if (el) {
        el.classList.remove('yellow', 'blue');
        el.classList.add('green');
      }
    }
    playTone(900, 0.1, 'sine', 0.2);
    setTimeout(() => playTone(1200, 0.15, 'sine', 0.2), 100);
    
    // بررسی برد کامل
    checkFullWin();
  }
}

function checkFullWin() {
  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 5; c++) {
      if (grid[r][c] === 1 && userGrid[r][c] !== solution[r][c]) {
        return;
      }
    }
  }
  gameRunning = false;
  showToast('🎉 تبریک! جدول کامل شد');
  addCoins(100); // جایزه
  setTimeout(() => {
    document.getElementById('startOverlay').classList.remove('hidden');
  }, 2000);
}

// ===== کیبورد =====
function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  const rows = [
    ['ض','ص','ث','ق','ف','غ','ع','ه','خ'],
    ['ش','س','ی','ب','ل','ا','ت','ن','م'],
    ['ظ','ط','ز','ر','ذ','د','پ','و','ژ']
  ];
  
  rows.forEach((row, idx) => {
    const rowEl = document.createElement('div');
    rowEl.className = 'kb-row';
    
    if (idx === 2) {
      const hintBtn = document.createElement('button');
      hintBtn.className = 'key action hint';
      hintBtn.textContent = '💡 راهنما';
      hintBtn.onclick = useHint;
      rowEl.appendChild(hintBtn);
    }
    
    row.forEach(l => {
      const key = document.createElement('button');
      key.className = 'key';
      key.textContent = l;
      key.onclick = () => typeLetter(l);
      rowEl.appendChild(key);
    });
    
    if (idx === 2) {
      const delBtn = document.createElement('button');
      delBtn.className = 'key action delete';
      delBtn.textContent = '⌫';
      delBtn.onclick = deleteLetter;
      rowEl.appendChild(delBtn);
    }
    
    kb.appendChild(rowEl);
  });
}

// ===== ابزارها =====
function toPersian(num) {
  return String(num).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ===== شروع =====
function startGame() {
  document.getElementById('startOverlay').classList.add('hidden');
  gameRunning = true;
  activeCell = null;
  buildGrid();
  renderBoard();
  buildKeyboard();
  document.getElementById('clueBubble').classList.remove('show');
}

// کیبورد فیزیکی
const PERSIAN_LETTERS = ['ا','ب','پ','ت','ث','ج','چ','ح','خ','د','ذ','ر','ز','ژ','س','ش','ص','ض','ط','ظ','ع','غ','ف','ق','ک','گ','ل','م','ن','و','ه','ی'];
document.addEventListener('keydown', (e) => {
  if (!gameRunning) return;
  if (e.key === 'Backspace') { deleteLetter(); e.preventDefault(); }
  else if (PERSIAN_LETTERS.includes(e.key)) { typeLetter(e.key); e.preventDefault(); }
});

// شروع اولیه
loadCoins();
buildKeyboard(); // کیبورد رو از اول می‌سازیم که دیده بشه
</script>
