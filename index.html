<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="version" content="17.0.0">
<meta name="author" content="امیررضا غلامی">
<meta name="theme-color" content="#050510">
<title>کهکشان‌شکن — نسخه ۱۷.۰.۰ (نسخه نهایی)</title>
<style>
  :root {
    --bg-dark: #050510;
    --neon-cyan: #22d3ee;
    --neon-pink: #f472b6;
    --neon-purple: #a78bfa;
    --neon-gold: #fbbf24;
    --neon-red: #ef4444;
    --text: #f8fafc;
    --panel: rgba(255,255,255,0.06);
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: Tahoma, sans-serif;
    background: var(--bg-dark);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    color: var(--text);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  
  .container {
    width: 100%;
    max-width: 440px;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-height: 850px;
  }
  
  /* هدر */
  .header {
    text-align: center;
    margin-bottom: 8px;
    position: relative;
  }
  
  h1 {
    font-size: 26px;
    font-weight: 900;
    margin-bottom: 2px;
    background: linear-gradient(90deg, #22d3ee, #a78bfa, #f472b6, #fbbf24);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 3s linear infinite;
    filter: drop-shadow(0 0 10px rgba(167,139,250,0.5));
  }
  
  @keyframes shimmer {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }
  
  .subtitle {
    font-size: 10px;
    opacity: 0.8;
  }
  
  .subtitle .author { color: var(--neon-gold); font-weight: bold; }
  
  /* آمار */
  .stats {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }
  
  .stat {
    background: var(--panel);
    backdrop-filter: blur(10px);
    padding: 5px;
    border-radius: 8px;
    flex: 1;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.05);
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  
  .stat-label { font-size: 8px; color: #94a3b8; margin-bottom: 2px; text-transform: uppercase; }
  .stat-value { font-size: 14px; font-weight: 900; color: var(--neon-cyan); }
  .stat-value.gold { color: var(--neon-gold); }
  .stat-value.pink { color: var(--neon-pink); }
  .stat-value.red { color: var(--neon-red); }
  
  /* ناحیه بازی */
  .game-area {
    flex: 1;
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 
      0 0 40px rgba(34,211,238,0.15),
      inset 0 0 40px rgba(0,0,0,0.9);
    border: 2px solid rgba(34,211,238,0.3);
    background: #050510;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.05s; /* برای افکت لرزش */
  }
  
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  
  /* صفحه شروع و پایان */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(5,5,15,0.92);
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 20px;
    text-align: center;
    transition: opacity 0.3s;
  }
  
  .overlay.hidden { display: none; }
  
  .overlay h2 {
    font-size: 28px;
    margin-bottom: 10px;
    color: var(--neon-cyan);
    text-shadow: 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-cyan);
  }
  
  .overlay p {
    font-size: 13px;
    color: #cbd5e1;
    margin-bottom: 20px;
    line-height: 1.8;
  }
  
  .btn {
    padding: 14px 36px;
    border: none;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 900;
    font-family: inherit;
    cursor: pointer;
    background: linear-gradient(135deg, #22d3ee, #06b6d4);
    color: #0f172a;
    box-shadow: 0 0 25px rgba(34,211,238,0.6);
    transition: 0.2s;
    position: relative;
    overflow: hidden;
  }
  
  .btn:active { transform: scale(0.95); }
  
  .btn-gold {
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    box-shadow: 0 0 25px rgba(251,191,36,0.6);
    color: #000;
  }
  
  /* صفحه باخت */
  .final-stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    width: 100%;
    max-width: 300px;
    margin-bottom: 20px;
    background: rgba(255,255,255,0.05);
    padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  
  .final-stat { text-align: center; }
  .final-stat .label { font-size: 9px; color: #94a3b8; }
  .final-stat .value { font-size: 16px; font-weight: 900; color: var(--neon-gold); }
  
  .new-record {
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    color: #000;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 12px;
    box-shadow: 0 0 20px rgba(251,191,36,0.8);
    animation: pulse 1s infinite;
  }
  
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  
  .footer {
    text-align: center;
    font-size: 9px;
    color: #64748b;
    margin-top: 6px;
  }
  
  .footer b { color: var(--neon-gold); }
  
  /* افکت کمبو */
  .combo-popup {
    position: absolute;
    top: 30%;
    left: 50%;
    transform: translateX(-50%) scale(0);
    font-size: 32px;
    font-weight: 900;
    color: var(--neon-gold);
    text-shadow: 0 0 20px var(--neon-gold);
    pointer-events: none;
    z-index: 5;
    opacity: 0;
  }
  
  .combo-popup.show {
    animation: comboAnim 0.6s ease-out forwards;
  }
  
  @keyframes comboAnim {
    0% { transform: translateX(-50%) scale(0.5); opacity: 1; }
    50% { transform: translateX(-50%) scale(1.2); opacity: 1; }
    100% { transform: translateX(-50%) scale(1.5); opacity: 0; }
  }
  
  /* دکمه بی‌صدا */
  .sound-btn {
    position: absolute;
    top: 8px;
    left: 8px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: none;
    color: #fff;
    font-size: 14px;
    z-index: 20;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>کهکشان‌شکن</h1>
    <div class="subtitle">ساخته شده توسط <span class="author">امیررضا غلامی</span> • v17.0.0</div>
  </div>
  
  <div class="stats">
    <div class="stat">
      <div class="stat-label">امتیاز</div>
      <div class="stat-value" id="score">۰</div>
    </div>
    <div class="stat">
      <div class="stat-label">مرحله</div>
      <div class="stat-value pink" id="level">۱</div>
    </div>
    <div class="stat">
      <div class="stat-label">جان</div>
      <div class="stat-value red" id="lives">❤️❤️❤️</div>
    </div>
    <div class="stat">
      <div class="stat-label">رکورد</div>
      <div class="stat-value gold" id="best">۰</div>
    </div>
  </div>
  
  <div class="game-area" id="gameArea">
    <button class="sound-btn" onclick="toggleSound()" id="soundBtn">🔊</button>
    <canvas id="game" width="360" height="480"></canvas>
    <div class="combo-popup" id="comboPopup">🔥</div>
    
    <!-- شروع -->
    <div class="overlay" id="startOverlay">
      <h2>🌌 کهکشان‌شکن</h2>
      <p>سفینه رو با انگشتت کنترل کن<br>آجرها رو بشکن و رکورد بزن!<br>مراقب جان‌هات باش...</p>
      <button class="btn" onclick="startGame()">شروع مأموریت</button>
    </div>
    
    <!-- پایان -->
    <div class="overlay hidden" id="gameoverOverlay">
      <h2>💥 مأموریت شکست خورد!</h2>
      <div id="newRecordBadge"></div>
      <div class="final-stats">
        <div class="final-stat">
          <div class="label">امتیاز</div>
          <div class="value" id="finalScore">۰</div>
        </div>
        <div class="final-stat">
          <div class="label">مرحله</div>
          <div class="value" id="finalLevel">۱</div>
        </div>
        <div class="final-stat">
          <div class="label">رکورد</div>
          <div class="value" id="finalBest">۰</div>
        </div>
      </div>
      <button class="btn btn-gold" onclick="startGame()">🔄 تلاش مجدد</button>
    </div>
  </div>
  
  <div class="footer">نسخه <b>17.0.0</b> — Galaxy Breaker Edition</div>
</div>

<script>
// ===== اطلاعات نسخه =====
const APP_VERSION = '17.0.0';
const APP_AUTHOR = 'امیررضا غلامی';
console.log(`🌌 کهکشان‌شکن v${APP_VERSION}`);
console.log(`👨‍💻 ساخته شده توسط: ${APP_AUTHOR}`);

// ===== تنظیمات =====
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const gameArea = document.getElementById('gameArea');

function resizeCanvas() {
  const rect = gameArea.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
}
window.addEventListener('resize', resizeCanvas);
setTimeout(resizeCanvas, 100);

// ===== متغیرهای بازی =====
let gameRunning = false;
let animationId = null;
let score = 0;
let level = 1;
let lives = 3;
let best = parseInt(localStorage.getItem('galaxy_breaker_best') || '0');
let combo = 0;
let comboTimer = null;
let soundEnabled = true;

// ===== اشیاء بازی =====
let paddle = { width: 80, height: 12, x: 0, y: 0, targetX: 0 };
let balls = []; // آرایه برای پشتیبانی از توپ‌های چندتایی
let bricks = [];
let particles = [];
let powerups = [];
let shield = null;

// تنظیمات آجرها
const BRICK_ROWS = 6;
const BRICK_COLS = 6;
const BRICK_HEIGHT = 20;
const BRICK_PADDING = 5;
const BRICK_OFFSET_TOP = 50;

const COLORS_HEX = ['#f472b6', '#a78bfa', '#22d3ee', '#10b981', '#fbbf24', '#ef4444'];

// ===== صدا =====
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playTone(freq, duration = 0.1, type = 'sine', volume = 0.15) {
  if (!soundEnabled) return;
  try {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}
function vibrate(ms = 15) { if (navigator.vibrate) navigator.vibrate(ms); }
function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById('soundBtn').textContent = soundEnabled ? '🔊' : '🔇';
}

// ===== ساخت آجرها =====
function createBricks() {
  bricks = [];
  powerups = [];
  const playWidth = canvas.width;
  const brickWidth = (playWidth - BRICK_PADDING * (BRICK_COLS + 1)) / BRICK_COLS;
  
  for (let r = 0; r < BRICK_ROWS; r++) {
    for (let c = 0; c < BRICK_COLS; c++) {
      if (Math.random() < 0.05 && level > 1) continue; 
      
      let health = 1;
      if (level >= 3 && Math.random() < 0.2) health = 2; // آجر سخت
      
      bricks.push({
        x: BRICK_PADDING + c * (brickWidth + BRICK_PADDING),
        y: BRICK_OFFSET_TOP + r * (BRICK_HEIGHT + BRICK_PADDING),
        width: brickWidth,
        height: BRICK_HEIGHT,
        colorHex: COLORS_HEX[r],
        alive: true,
        health: health,
        maxHealth: health
      });
    }
  }
}

// ===== شروع بازی =====
function startGame() {
  document.getElementById('startOverlay').classList.add('hidden');
  document.getElementById('gameoverOverlay').classList.add('hidden');
  
  resizeCanvas();
  score = 0;
  level = 1;
  lives = 3;
  combo = 0;
  updateUI();
  
  paddle.width = 80;
  paddle.y = canvas.height - 40;
  paddle.x = (canvas.width - paddle.width) / 2;
  paddle.targetX = paddle.x + paddle.width / 2;
  
  resetBalls();
  createBricks();
  shield = null;
  gameRunning = true;
  
  if (animationId) cancelAnimationFrame(animationId);
  loop();
}

function resetBalls() {
  balls = [{
    x: canvas.width / 2,
    y: paddle.y - 20,
    radius: 8,
    dx: 4 * (Math.random() > 0.5 ? 1 : -1),
    dy: -5,
    speed: 5
  }];
}

// ===== ذخیره بهترین امتیاز =====
function saveBest() {
  if (score > best) {
    best = score;
    localStorage.setItem('galaxy_breaker_best', best);
    return true;
  }
  return false;
}

function updateUI() {
  document.getElementById('score').textContent = toPersian(score);
  document.getElementById('level').textContent = toPersian(level);
  document.getElementById('best').textContent = toPersian(best);
  document.getElementById('lives').textContent = '❤️'.repeat(lives) || '💔';
}

// ===== حلقه اصلی =====
function loop() {
  if (!gameRunning) return;
  update();
  draw();
  animationId = requestAnimationFrame(loop);
}

function update() {
  // حرکت تخته
  const paddleCenter = paddle.x + paddle.width / 2;
  const diff = paddle.targetX - paddleCenter;
  paddle.x += diff * 0.35;
  
  if (paddle.x < 0) paddle.x = 0;
  if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;
  
  // آپدیت توپ‌ها
  for (let i = balls.length - 1; i >= 0; i--) {
    const ball = balls[i];
    ball.x += ball.dx;
    ball.y += ball.dy;
    
    // برخورد با دیوارها
    if (ball.x - ball.radius < 0) { ball.x = ball.radius; ball.dx = Math.abs(ball.dx); playTone(300, 0.03); }
    if (ball.x + ball.radius > canvas.width) { ball.x = canvas.width - ball.radius; ball.dx = -Math.abs(ball.dx); playTone(300, 0.03); }
    if (ball.y - ball.radius < 0) { ball.y = ball.radius; ball.dy = Math.abs(ball.dy); playTone(300, 0.03); }
    
    // برخورد با سپر
    if (shield && ball.y + ball.radius > shield.y && ball.y - ball.radius < shield.y + shield.height && 
        ball.x > shield.x && ball.x < shield.x + shield.width) {
      ball.dy = -Math.abs(ball.dy);
      ball.y = shield.y - ball.radius;
      playTone(600, 0.05);
      shield.health--;
      if (shield.health <= 0) shield = null;
    }
    
    // برخورد با تخته
    if (ball.y + ball.radius > paddle.y &&
        ball.y - ball.radius < paddle.y + paddle.height &&
        ball.x + ball.radius > paddle.x &&
        ball.x - ball.radius < paddle.x + paddle.width) {
      
      const hitPos = (ball.x - paddle.x) / paddle.width;
      const angle = (hitPos - 0.5) * Math.PI * 0.7;
      const speed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
      
      ball.dx = Math.sin(angle) * speed;
      ball.dy = -Math.abs(Math.cos(angle) * speed);
      ball.y = paddle.y - ball.radius;
      playTone(500, 0.05);
    }
    
    // برخورد با آجرها
    for (const brick of bricks) {
      if (!brick.alive) continue;
      
      if (ball.x + ball.radius > brick.x && ball.x - ball.radius < brick.x + brick.width &&
          ball.y + ball.radius > brick.y && ball.y - ball.radius < brick.y + brick.height) {
        
        const overlapLeft = (ball.x + ball.radius) - brick.x;
        const overlapRight = (brick.x + brick.width) - (ball.x - ball.radius);
        const overlapTop = (ball.y + ball.radius) - brick.y;
        const overlapBottom = (brick.y + brick.height) - (ball.y - ball.radius);
        const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);
        
        if (minOverlap === overlapLeft || minOverlap === overlapRight) ball.dx = -ball.dx;
        else ball.dy = -ball.dy;
        
        // آسیب به آجر
        brick.health--;
        if (brick.health <= 0) {
          brick.alive = false;
          handleCombo();
          score += 10 * (1 + Math.floor(combo / 3));
          updateUI();
          createParticles(brick.x + brick.width/2, brick.y + brick.height/2, brick.colorHex);
          playTone(600 + Math.random() * 300, 0.05);
          vibrate(10);
          
          // شانس افتادن آیتم
          if (Math.random() < 0.15) spawnPowerup(brick.x + brick.width/2, brick.y + brick.height/2);
          
          if (bricks.every(b => !b.alive)) { nextLevel(); return; }
        } else {
          playTone(400, 0.05, 'square', 0.1);
        }
        break;
      }
    }
    
    // سقوط توپ
    if (ball.y - ball.radius > canvas.height) {
      balls.splice(i, 1);
      if (balls.length === 0) loseLife();
    }
  }
  
  // آپدیت آیتم‌ها
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.y += 2;
    if (p.y > paddle.y && p.y < paddle.y + paddle.height && p.x > paddle.x && p.x < paddle.x + paddle.width) {
      applyPowerup(p.type);
      powerups.splice(i, 1);
    } else if (p.y > canvas.height) {
      powerups.splice(i, 1);
    }
  }
  
  // آپدیت ذرات
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life -= 0.02;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function handleCombo() {
  combo++;
  if (combo > 1) {
    const popup = document.getElementById('comboPopup');
    popup.textContent = `🔥 ×${toPersian(combo)}`;
    popup.classList.remove('show');
    void popup.offsetWidth;
    popup.classList.add('show');
  }
  clearTimeout(comboTimer);
  comboTimer = setTimeout(() => { combo = 0; }, 2000);
}

function spawnPowerup(x, y) {
  const types = ['bigball', 'multiball', 'shield'];
  powerups.push({ x, y, type: types[Math.floor(Math.random() * types.length)], radius: 12 });
}

function applyPowerup(type) {
  playTone(1000, 0.2, 'sine', 0.2);
  if (type === 'bigball') {
    balls.forEach(b => b.radius = 12);
    showToast('🟢 توپ بزرگ!');
  } else if (type === 'multiball') {
    const b = balls[0];
    if (b) {
      balls.push({ ...b, dx: -b.dx });
      balls.push({ ...b, dy: -b.dy });
      showToast('🔴 توپ چندتایی!');
    }
  } else if (type === 'shield') {
    shield = { x: 0, y: canvas.height - 80, width: canvas.width, height: 10, health: 3 };
    showToast('🟡 سپر محافظ!');
  }
}

function loseLife() {
  lives--;
  updateUI();
  playTone(150, 0.3, 'sawtooth', 0.2);
  vibrate([50, 50, 100]);
  
  // افکت لرزش صفحه
  gameArea.style.transform = 'translateX(-5px)';
  setTimeout(() => gameArea.style.transform = 'translateX(5px)', 50);
  setTimeout(() => gameArea.style.transform = 'translateX(-5px)', 100);
  setTimeout(() => gameArea.style.transform = 'translateX(0)', 150);
  
  if (lives <= 0) {
    gameOver();
  } else {
    resetBalls();
    paddle.x = (canvas.width - paddle.width) / 2;
    paddle.targetX = paddle.x + paddle.width / 2;
  }
}

// ===== رسم =====
function draw() {
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // رسم خطوط زمینه
  ctx.strokeStyle = 'rgba(34,211,238,0.03)';
  for (let i = 0; i < canvas.width; i += 30) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
  }
  
  // رسم آجرها
  for (const brick of bricks) {
    if (!brick.alive) continue;
    ctx.fillStyle = brick.colorHex;
    if (brick.health < brick.maxHealth) ctx.fillStyle = '#64748b'; // آجر آسیب‌دیده
    ctx.shadowColor = brick.colorHex;
    ctx.shadowBlur = 10;
    roundRect(ctx, brick.x, brick.y, brick.width, brick.height, 4);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  
  // رسم آیتم‌ها
  for (const p of powerups) {
    ctx.fillStyle = p.type === 'bigball' ? '#10b981' : p.type === 'multiball' ? '#ef4444' : '#fbbf24';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 15;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }
  
  // رسم سپر
  if (shield) {
    ctx.fillStyle = 'rgba(251,191,36,0.5)';
    ctx.fillRect(shield.x, shield.y, shield.width, shield.height);
  }
  
  // رسم توپ‌ها
  for (const b of balls) {
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#22d3ee';
    ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }
  
  // رسم تخته
  const grad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x + paddle.width, paddle.y);
  grad.addColorStop(0, '#22d3ee'); grad.addColorStop(1, '#a78bfa');
  ctx.fillStyle = grad;
  ctx.shadowColor = '#22d3ee';
  ctx.shadowBlur = 15;
  roundRect(ctx, paddle.x, paddle.y, paddle.width, paddle.height, 6); ctx.fill();
  ctx.shadowBlur = 0;
  
  // رسم ذرات
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}

function createParticles(x, y, color) {
  for (let i = 0; i < 10; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 4;
    particles.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, size: 1+Math.random()*2.5, color, life: 1 });
  }
}

// ===== مرحله بعد =====
function nextLevel() {
  level++;
  paddle.width = Math.max(50, 80 - level * 2);
  paddle.x = (canvas.width - paddle.width) / 2;
  paddle.targetX = paddle.x + paddle.width / 2;
  resetBalls();
  createBricks();
  shield = null;
  updateUI();
  playTone(1000, 0.2); setTimeout(()=>playTone(1500, 0.2), 100);
  showToast(`🚀 مرحله ${toPersian(level)}!`);
}

// ===== باخت =====
function gameOver() {
  gameRunning = false;
  if (animationId) cancelAnimationFrame(animationId);
  playTone(200, 0.3, 'sawtooth'); setTimeout(()=>playTone(150, 0.4, 'sawtooth'), 150);
  
  const isNewRecord = saveBest();
  document.getElementById('finalScore').textContent = toPersian(score);
  document.getElementById('finalLevel').textContent = toPersian(level);
  document.getElementById('finalBest').textContent = toPersian(best);
  document.getElementById('newRecordBadge').innerHTML = isNewRecord && score > 0 ? '<div class="new-record">🏆 رکورد جدید!</div>' : '';
  
  setTimeout(() => document.getElementById('gameoverOverlay').classList.remove('hidden'), 300);
}

// ===== کنترل لمسی =====
function handleTouch(e) {
  if (!gameRunning) return;
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const touch = e.touches ? e.touches[0] : e;
  paddle.targetX = (touch.clientX - rect.left) * scaleX;
}

canvas.addEventListener('touchstart', handleTouch, { passive: false });
canvas.addEventListener('touchmove', handleTouch, { passive: false });
canvas.addEventListener('mousemove', (e) => {
  if (!gameRunning) return;
  const rect = canvas.getBoundingClientRect();
  paddle.targetX = (e.clientX - rect.left) * (canvas.width / rect.width);
});

// ===== ابزار =====
function toPersian(num) { return String(num).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }

function showToast(msg) {
  // یه توست ساده روی کانواس
  const toast = document.createElement('div');
  toast.textContent = msg;
  toast.style.cssText = `position:fixed; top:15%; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); color:#fff; padding:8px 16px; border-radius:20px; font-size:12px; z-index:1000; pointer-events:none;`;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 1500);
}

// ===== شروع اولیه =====
updateUI();
resizeCanvas();
</script>
